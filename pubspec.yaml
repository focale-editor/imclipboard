name: imclipboard
description: Read and write raster images through the system clipboard on Flutter's desktop, mobile, and web platforms.
version: 0.3.1
homepage: https://github.com/focale-editor/imclipboard
repository: https://github.com/focale-editor/imclipboard

topics:
  - clipboard
  - image
  - cross-platform
  - flutter-plugin
  - web

screenshots:
  - description: 'A flat illustration of copying and pasting raster images.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  imcodec: '>=0.5.0 <0.6.0'
  plugin_platform_interface: ^2.1.8
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  release: ^0.1.11

flutter:
  plugin:
    platforms:
      android:
        package: app.focaleeditor.imclipboard
        pluginClass: ImclipboardPlugin
      ios:
        pluginClass: ImclipboardPlugin
        sharedDarwinSource: true
      linux:
        pluginClass: ImclipboardPlugin
      macos:
        pluginClass: ImclipboardPlugin
        sharedDarwinSource: true
      web:
        pluginClass: ImClipboardWeb
        fileName: src/web.dart
      windows:
        pluginClass: ImclipboardPluginCApi

release:
  changelog:
    header: '# 📰 Imclipboard changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
